name: Renderer GPU and performance gates

# The tests/gpu project compiles real shaders and checks CPU/GPU parity, so it
# needs a working WebGPU adapter. Both projects launch Chromium with Metal, so
# they run as separate macOS jobs: shader/parity failures return quickly while
# the longer fixed-scene performance capture retains its own artifacts.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: renderer-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gpu:
    name: WebGPU suite (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Node 24 for npm 11; see the note in ci.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WebGPU tests
        run: npm run test:gpu

  perf:
    name: Tier-1 frame delivery and visual capture (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A hosted runner is not the pinned reference adapter: it renders the
      # same pixels (reference-viewport scores an identical SSIM here and on
      # the M3 Pro) but delivers them at roughly a third of the frame rate,
      # and its detail Worker does not come up at all. So the visual,
      # renderer-error and settling gates run here and the frame-delivery
      # contract does not; docs/PERFORMANCE.md scopes that contract to the
      # reference adapter, and the run prints every row it declined to gate.
      - name: Run focused PR capture
        if: github.event_name == 'pull_request'
        env:
          VITE_PERF_UNPINNED_HOST: "1"
        run: npm run perf:capture:ci

      - name: Run full capture
        if: github.event_name != 'pull_request'
        env:
          VITE_PERF_UNPINNED_HOST: "1"
        run: npm run perf:capture

      - name: Prove committed baselines were not mutated
        if: always()
        run: git diff --exit-code -- tests/perf/baseline

      - name: Upload capture report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/perf/artifacts/
          if-no-files-found: warn
          retention-days: 14
